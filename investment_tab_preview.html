<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>记一笔 · 投资 tab 预览</title>
<style>
  :root{
    --sage-deep:#5F9A6E; --sage:#93BF9A; --sage-soft:#E2EBDC;
    --cream:#FBF7EE; --ink:#2E3A2C; --ink2:#6B7A4F; --ink3:#7A8A5A;
    --hair:#E3E8DD; --card:#FFFFFF; --danger:#C0492F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#EDEFEA;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;color:var(--ink)}
  .phone{width:390px;min-height:780px;background:var(--cream);position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column}
  .appbar{display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 6px;font-size:17px;font-weight:600}
  .appbar .x{font-size:22px;color:var(--ink3);font-weight:400}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:18px;font-size:13px;
    background:#fff;border:1px solid var(--hair);color:var(--ink2);white-space:nowrap}
  .tab.on{background:linear-gradient(135deg,var(--sage),var(--sage-deep));color:#fff;border:none;font-weight:600}
  .body{flex:1;padding:8px 14px 14px;overflow-y:auto}
  .seg{display:flex;background:var(--sage-soft);border-radius:14px;padding:4px;margin:6px 0 14px}
  .seg div{flex:1;text-align:center;padding:10px 0;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink2)}
  .seg div.on{background:#fff;color:var(--sage-deep);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:14px;margin-bottom:12px}
  .amtcard{background:linear-gradient(135deg,#FFFDF8,#FBF4E2);border:1px solid #EFE6CF;border-radius:16px;
    padding:16px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .badge{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--sage-deep));
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:0 0 auto}
  .amt{flex:1;font-size:30px;font-weight:700;color:var(--ink);border:none;background:transparent;outline:none;width:100%}
  .amt::placeholder{color:#C9C2A8}
  .label{font-size:12px;color:var(--ink3);margin-bottom:6px}
  .field{display:flex;align-items:center;background:#F6F8F2;border:1px solid var(--hair);
    border-radius:12px;padding:12px 14px}
  .field .pre{color:var(--ink3);font-size:15px;margin-right:6px}
  .field input{flex:1;border:none;background:transparent;outline:none;font-size:15px;color:var(--ink)}
  .calc{width:30px;height:30px;border-radius:9px;background:var(--sage-soft);color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{padding:7px 11px;border-radius:11px;background:#F6F8F2;border:1px solid var(--hair);font-size:12.5px;color:var(--ink2)}
  .chip.new{border-style:dashed;color:var(--sage-deep)}
  .readonly{display:flex;justify-content:space-between;align-items:center;
    background:#F6F8F2;border-radius:12px;padding:12px 14px;margin-top:10px}
  .readonly .v{font-size:16px;font-weight:700;color:var(--sage-deep)}
  .acct{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#F3F8F1,#EAF2E6);
    border:1px solid var(--hair);border-radius:14px;padding:13px 14px}
  .acct .ic{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
  .acct .n{font-size:14px;font-weight:600}
  .acct .s{font-size:12px;color:var(--ink3)}
  .chev{margin-left:auto;color:var(--ink3)}
  .hint{display:flex;gap:7px;align-items:flex-start;background:#F1F6EE;border-radius:12px;
    padding:11px 12px;margin-top:4px;font-size:12px;line-height:1.5;color:var(--ink2)}
  .hint .i{color:var(--sage-deep);font-size:14px;flex:0 0 auto;margin-top:1px}
  .foot{padding:12px 14px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--hair)}
  .save{width:100%;padding:15px 0;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--sage),var(--sage-deep))}
  .sub{text-align:center;font-size:12px;color:var(--ink3);margin-top:8px}
</style>
</head>
<body>
<div class="phone">
  <div class="appbar"><span>记一笔</span><span class="x">✕</span></div>
  <div class="tabs">
    <div class="tab">支出</div><div class="tab">收入</div><div class="tab">转账</div>
    <div class="tab">借还</div><div class="tab">报销</div><div class="tab">退款</div>
    <div class="tab">存钱</div><div class="tab">分期</div>
    <div class="tab on">投资</div>
  </div>

  <div class="body">
    <div class="seg">
      <div class="on" id="buy">买入</div>
      <div id="sell">卖出</div>
    </div>

    <div class="card">
      <div class="label">持仓</div>
      <div class="field">
        <span class="pre">📈</span>
        <input id="holding" value="沪深300ETF · 110022" />
        <span class="chev">▾</span>
      </div>
    </div>

    <div class="amtcard">
      <div class="badge">¥</div>
      <input class="amt" id="amount" value="1,000.00" placeholder="0.00" inputmode="decimal" />
    </div>

    <div class="card">
      <div class="label">当前单价</div>
      <div class="field">
        <span class="pre">¥</span>
        <input id="price" value="1.2500" inputmode="decimal" />
        <div class="calc">🧮</div>
      </div>
      <div class="label" style="margin-top:12px">手续费</div>
      <div class="field">
        <span class="pre">¥</span>
        <input id="fee" value="1.00" inputmode="decimal" />
        <div class="calc">🧮</div>
      </div>
      <div class="readonly">
        <span class="label" style="margin:0" id="shareLabel">可得份额</span>
        <span class="v" id="shares">800 份</span>
      </div>
      <div class="readonly" style="margin-top:8px;background:#F1F6EE;border:1px dashed #CFE0C8">
        <span class="label" style="margin:0" id="netLabel">实际扣款</span>
        <span class="v" id="net">1,001.00 元</span>
      </div>
    </div>

    <div class="label" id="acctLabel" style="margin:2px 2px 6px">扣款账户</div>
    <div class="acct">
      <div class="ic">🏦</div>
      <div>
        <div class="n">招商银行 ****1234</div>
        <div class="s" id="acctSub">买入从该行扣款</div>
      </div>
      <span class="chev">▾</span>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="label">备注</div>
      <div class="field"><input placeholder="选填" /></div>
    </div>

    <div class="hint">
      <span class="i">ℹ</span>
      <span>份额 = 金额 ÷ 单价（手续费不占用金额）；买入另加手续费扣款，卖出从到账中扣手续费。投资买卖不计入收支统计 / 预算。</span>
    </div>
  </div>

  <div class="foot">
    <button class="save">保存</button>
    <div class="sub" id="sub">买入 1,000.00 元 · 手续费 1.00 · 得 800 份</div>
  </div>
</div>

<script>
  const buy=document.getElementById('buy'), sell=document.getElementById('sell');
  const amount=document.getElementById('amount'), price=document.getElementById('price'), fee=document.getElementById('fee');
  const shares=document.getElementById('shares'), shareLabel=document.getElementById('shareLabel');
  const net=document.getElementById('net'), netLabel=document.getElementById('netLabel');
  const acctLabel=document.getElementById('acctLabel'), acctSub=document.getElementById('acctSub');
  const sub=document.getElementById('sub'), holding=document.getElementById('holding');
  const num=s=>parseFloat(String(s).replace(/[, ]/g,''))||0;
  function fmt(n){return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}

  function recalc(){
    const a=num(amount.value), p=num(price.value), f=num(fee.value);
    const isBuy = buy.classList.contains('on');
    // 口径：金额=净交易金额；手续费另计——买入加到实际扣款，卖出从到账中扣
    const netV = isBuy ? (a + f) : Math.max(0, a - f);
    const sh = p>0 ? (a/p) : 0;
    shares.textContent = sh.toLocaleString('zh-CN',{maximumFractionDigits:4}) + ' 份';
    shareLabel.textContent = isBuy ? '可得份额' : '赎回份额';
    net.textContent = fmt(netV) + ' 元';
    netLabel.textContent = isBuy ? '实际扣款' : '实际到账';
    sub.textContent = (isBuy?'买入 ':'卖出 ') + fmt(a) + ' 元 · 手续费 ' + fmt(f) + ' · ' + (isBuy?'得 ':'赎回 ') + sh.toLocaleString('zh-CN',{maximumFractionDigits:4}) + ' 份';
  }
  function setMode(isBuy){
    buy.classList.toggle('on',isBuy); sell.classList.toggle('on',!isBuy);
    acctLabel.textContent = isBuy ? '扣款账户' : '入账账户';
    acctSub.textContent = isBuy ? '买入从该行扣款' : '卖出入账到该行';
    holding.value = isBuy ? '沪深300ETF · 110022' : '沪深300ETF · 110022（持仓 1,200 份）';
    recalc();
  }
  buy.onclick=()=>setMode(true); sell.onclick=()=>setMode(false);
  amount.oninput=recalc; price.oninput=recalc; fee.oninput=recalc;
  recalc();
</script>
</body>
</html>
