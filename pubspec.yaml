name: pocket_ledger
description: "个人记账与资产管理 App —— 本地优先架构，云端可选同步。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^15.1.2

  # 本地数据库（主库）
  drift: ^2.19.0
  sqlite3: ^2.3.0
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.5
  path: ^1.9.0

  # 网络（仅用于云端同步）
  dio: ^5.11.1
  connectivity_plus: ^7.3.1
  retry: ^3.1.2

  # UI
  # 图表。必须锁 0.69.0：0.70+ 起改用 Flutter 3.27 才有的
  # Color.a/r/g/b 与 withValues API，在 Flutter 3.24 上编译不过。
  fl_chart: 0.69.0
  intl: ^0.19.0
  gap: ^3.0.1
  flutter_slidable: ^3.1.2

  # 工具
  collection: ^1.18.0
  uuid: ^4.6.0
  equatable: ^2.1.0

  # 安全与设备
  flutter_secure_storage: ^10.3.1
  local_auth: ^2.3.0
  device_info_plus: ^11.3.0

  # 文件与分享
  share_plus: ^12.0.2
  csv: ^6.0.0
  image_picker: ^1.1.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.19.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
