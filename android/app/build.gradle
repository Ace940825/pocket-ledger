plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.pocketledger.pocket_ledger"
    // file_picker → flutter_plugin_android_lifecycle 要求 compileSdk ≥ 36，
    // Flutter 默认值（34）不够，这里显式覆盖（compileSdk 可高于 targetSdk，不影响运行时行为）。
    compileSdk = 36
    // 覆盖 Flutter 默认要求的 28.2.13670358（本地仅装到接近补丁版 28.2.13676358）
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // flutter_local_notifications 要求开启 core library desugaring
        // （插件内部用了 java.time 等 Java 8+ API，需脱糖才能跑在低版本 Android 上）。
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.pocketledger.pocket_ledger"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
