name: pocket_lints
description: Custom lint rules that guard pocket_ledger's theme-hardening conventions.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  # 锁定 6.4.x 线：analyzer >=6.5.0 会传递依赖 macros/_macros，
  # 而 macros SDK 包在 Dart 3.13（Flutter 3.47）里已被移除，pub get 直接失败。
  # analyzer 6.4.1 不依赖 macros，且满足 custom_lint_builder 0.6.0 的约束。
  analyzer: ^6.4.1
  custom_lint_builder: 0.6.0

dev_dependencies:
  custom_lint: 0.6.0
  test: ^1.24.0
